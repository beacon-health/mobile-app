plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Upload-key signing. key.properties and the keystore itself are gitignored and
// never live in the repo — see README "Android release signing". When the file is
// absent (a fresh clone, or CI without the secrets wired) the release build falls
// back to debug keys so `flutter run --release` still works locally; that build
// simply cannot be uploaded to Play.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    compileSdkVersion flutter.compileSdkVersion

    // Pinned to the highest NDK any plugin asks for (jni, via the location
    // plugins). NDK releases are backward compatible, so the highest wins.
    ndkVersion = "28.2.13676358"

    namespace 'org.beaconhealth.app'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Matches the iOS bundle identifier. The Android Maps API key is
        // restricted to this package name — changing it invalidates the key.
        applicationId "org.beaconhealth.app"
        minSdkVersion flutter.minSdkVersion
        // Track the Flutter SDK rather than pinning: a hardcoded 30 is below
        // Play's minimum target and blocks release uploads.
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: localProperties.getProperty('GOOGLE_MAPS_API_KEY', '')
        ]
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
