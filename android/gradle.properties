org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# Jetifier rewrites legacy android.support.* artifacts to AndroidX. Every plugin
# this app depends on is AndroidX-native, so it had nothing to do but burn heap —
# its transform was OOMing the build at the old 1536M.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
