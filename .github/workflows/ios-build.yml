name: iOS Build & TestFlight

on:
  push:
    branches: [main]
    # Don't burn macOS minutes on doc-only commits.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: # also allow manual runs

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install dependencies
        run: flutter pub get

      - name: Create Secrets.xcconfig
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            > ios/Flutter/Secrets.xcconfig

      - name: Build iOS
        # Build number = a monotonic, unique value so TestFlight never rejects
        # a duplicate. Offset by 1000 to stay above any manually-uploaded
        # builds. Flutter injects this into CFBundleVersion; Fastlane's gym
        # archives that same number.
        run: |
          flutter build ios --release --no-codesign \
            --build-number=$(( 1000 + ${{ github.run_number }} )) \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      # Symbolicates release crashes. `secrets` isn't readable from a step-level
      # `if`, hence the env hop; skipped entirely when the token is absent.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: dart run sentry_dart_plugin

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          bundle exec fastlane beta
