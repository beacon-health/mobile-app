name: beacon_app
description: A new Flutter project.

publish_to: "none"

version: 0.1.1

environment:
  sdk: ^3.6.0

dependencies:
  flutter_signin_button: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  google_maps_flutter: ^2.9.0
  path_provider: ^2.1.4
  geolocator: ^10.1.0
  geocoding: ^4.0.0
  url_launcher: ^6.1.11
  supabase_flutter: ^2.1.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/beacon-logo.png
    - assets/app_icon_final.jpg
    - assets/tiny_icon.png
    - assets/map_styles/
    - assets/demo/demo_facilities.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_final.jpg"
